name: Update AFP Data

on:
  schedule:
    # 8:00 AM Santiago time (UTC-3 → 11:00 UTC) on days 1 and 10 of each month.
    # SP publishes the previous month's rentabilidades during the first business
    # days, so the day-1 run often misses it; the day-10 run catches it.
    # If nothing changed, the commit step is a no-op.
    - cron: "0 11 1 * *"
    - cron: "0 11 10 * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

# Never let two runs (scheduled or manual) race each other on push
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python -m etl.run_pipeline

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output/*.json frontend/public/data/*.json
          git diff --staged --quiet || git commit -m "chore: update AFP data $(date +'%Y-%m-%d')"

      - name: Push changes
        run: git push
